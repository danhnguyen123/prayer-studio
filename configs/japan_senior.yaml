# =========================================================================
# Writer Pro — Japanese seniors emotional storytelling
# =========================================================================
# Persona DNA (.md) là nguồn sự thật về Style / Tone / Focus / Audience.
# YAML này chỉ giữ paths + length/quantity + topic của batch hiện tại.
# =========================================================================

name: "Japan 60+ Emotional Storytelling"

# ---------- Phase 1: Training (build Persona DNA) ----------
sample_folder: "samples/japan_senior"
persona_file:  "personas/analysis_japan_senior.md"

# Channel brief — feed vào Phase 1 cùng với samples để build Persona DNA.
# Có thể viết inline ở đây, HOẶC trỏ training_brief_file tới 1 file .md riêng.
training_brief: |
  Channel YouTube cho người Nhật trên 60 tuổi (pension life, retirees).
  FOCUS: Daily life, pension life, loneliness, small habits, emotional healing,
         human warmth, rediscovering happiness.
  TARGET AUDIENCE: Japanese people over 60 years old.

# Optional: dùng file riêng thay vì viết inline (nếu set thì override training_brief)
# training_brief_file: "personas/brief_japan_senior.md"

# refine_mode: chế độ khi train lại với persona đã tồn tại.
#   "new_only" (default): chỉ đọc *.txt có mtime > persona md → fold delta vào, rẻ.
#   "all": đọc TẤT CẢ samples trong folder (an toàn nhất, đắt — dùng khi reset persona).
#   "folder:samples/japan_senior/new": đọc từ subfolder riêng (chủ động quản lý).
# refine_mode: "new_only"

# ---------- Phase 2: Generation ----------
output_folder: "output/japan_senior"

# Length unit: "auto" (default — CJK→chars, Latin→words) | "chars" | "words"
length_unit:      "auto"
target_length:    4000   # Japanese chars ≈ 10 phút TTS (auto-detect → unit "chars").
length_tolerance: 0.15   # ±15% → window 3400-4600 chars.
length_per_part:  2000   # Japanese natural ~2000/part.
quantity:         3      # số kịch bản tạo trong batch

max_tokens:     8000

# ---------- Topic của batch này ----------
topic: "Một bà cụ goá chồng tìm lại niềm vui qua quán café nhỏ trong khu phố"

# Optional: ngôn ngữ output. Nếu để null, Persona DNA tự quyết định (mục Market & Output Language).
output_language: "Japanese"

# Optional: trỏ tới 1 kịch bản viral mới (chưa được fold vào Persona DNA).
# Nếu set, nội dung file sẽ được append vào REQ kèm warning "chỉ học phong cách,
# tuyệt đối không sao chép nội dung/nhân vật/bối cảnh/tình tiết".
# Dùng khi: đối thủ vừa có hit, muốn bắt kịp "freshness" mà chưa kịp train lại persona.
# Lưu ý chi phí: file viral được gửi MỖI request → file lớn = tốn token. Cân nhắc trim
# xuống đoạn hook + climax tiêu biểu (~1500-3000 chars).
# viral_sample_file: "samples/viral/competitor_hit_2025.txt"

# Optional: override / augment tạm thời cho batch này, không sửa persona.
# extra_instructions: |
#   Lần này hãy chèn 1 ký ức tuổi 20 của nhân vật chính.
#   Kết bài bằng 1 câu hỏi mở để khán giả comment.

# ---------- Sạch cho TTS ----------
tts_clean: true

# ---------- Model ----------
model_training:   "claude-opus-4-7"
model_generation: "claude-opus-4-7"

# Optional: override REQ template. Placeholder hỗ trợ: [Điền Chủ Đề Của Bạn Vào Đây]
# req_template: |
#   ...
