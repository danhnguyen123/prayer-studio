services:
  prayer-studio:
    build: .
    image: prayer-studio:latest
    container_name: prayer-studio
    restart: unless-stopped
    # Gộp env: .env (secret của bạn, scp riêng, không commit) + .env.production
    # (override cho production, có trong repo). File sau ghi đè file trước.
    env_file:
      - .env
      - .env.production
    # Mở ra public IP:port. BẮT BUỘC đặt APP_BASIC_AUTH_USER/PASS trong .env,
    # và mở ingress cổng này ở Oracle Security List + ufw (xem DEPLOY.md).
    ports:
      - "4300:4300"
    volumes:
      # Media nguồn chỉ đọc; dữ liệu Prayer Studio ghi vào volume riêng.
      - /mnt/media/video:/media/video:ro
      - /mnt/media/image:/media/image:ro
      - /mnt/media/music:/media/music:ro
      - /mnt/media/prayer-studio:/media/prayer-studio
      # Dữ liệu runtime bền + dễ dọn (nằm trên host, không phình lớp ghi của container)
      - ./data/output:/app/output
      - ./data/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
